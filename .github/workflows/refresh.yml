name: Refresh job listings

on:
  schedule:
    # 11:00 UTC daily = 6am ET / 3am PT. GitHub may delay cron runs by a few minutes.
    - cron: "0 11 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["fetch_jobs.py", "companies.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch jobs
        run: python fetch_jobs.py --workers 12
      - name: Commit refreshed data
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add docs/data/jobs.json docs/data/jobs.js data/seen.json
          git diff --cached --quiet || git commit -m "Refresh listings $(date -u +%Y-%m-%d)"
          git push
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
