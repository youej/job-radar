name: Refresh job listings

on:
  schedule:
    # 11:00 UTC daily = 6am ET / 3am PT. GitHub may delay cron runs by a few minutes.
    - cron: "0 11 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["fetch_jobs.py", "companies.json", "docs/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the live branch tip, not the commit the run was triggered from
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch jobs
        run: python fetch_jobs.py --workers 12
      - name: Commit refreshed data
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add docs/data/jobs.json docs/data/jobs.js data/seen.json
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Refresh listings $(date -u +%Y-%m-%d)"
          # Another run may have pushed while this one was fetching: replay our commit on
          # top of it, keeping our (fresher) data on any conflict, then push.
          git fetch origin main
          git rebase -X theirs origin/main
          git push origin HEAD:main
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
